<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">兒童及少年福利與權益保障法條文摘錄</title><desc id="desc">父母監護人禁止兒少吸菸飲酒嚼檳榔，業者拒絕兒少進入不良場所</desc><rect width="720" height="340" rx="18" fill="#f8f4e9" stroke="#8d7b58" stroke-width="3"/><text x="360" y="54" text-anchor="middle" font-size="23" font-family="serif" font-weight="700">法律條文摘錄（題意重製）</text><path d="M70 78H650" stroke="#b29c70" stroke-width="2"/><g font-family="serif" font-size="20" fill="#302a20"><text x="85" y="125">父母、監護人應禁止兒童及少年吸菸、飲酒、嚼檳榔。</text><text x="85" y="180">業者應拒絕兒童及少年進入不良場所。</text><text x="85" y="235">違反規定者，依法得處罰鍰。</text></g><text x="360" y="305" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#666">依題幹提供的條文內容整理</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">河川鯰魚族群數量變化四階段示意圖</title><desc id="desc">甲期上升，乙期持續上升，丙期大致穩定，丁期下降；只呈現題幹給出的趨勢。</desc>
  <rect width="900" height="420" rx="24" fill="#f4f7fb"/><text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#10273b">族群數量（趨勢示意，非實測數值）</text><path d="M110 330V92M110 330H820" fill="none" stroke="#42576c" stroke-width="4"/><path d="M119 296 C195 285 214 240 280 228 S390 151 456 150 S552 150 620 150 S711 237 804 273" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/><g font-family="sans-serif" text-anchor="middle" fill="#10273b" font-size="24" font-weight="700"><text x="195" y="370">甲：增加</text><text x="375" y="370">乙：持續增加</text><text x="570" y="370">丙：大致穩定</text><text x="750" y="370">丁：減少</text></g><g stroke="#9aabc0" stroke-dasharray="7 8" stroke-width="2"><path d="M280 140v185"/><path d="M465 140v185"/><path d="M650 140v185"/></g>
</svg>

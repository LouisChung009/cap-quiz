<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">吊橋相遇步數示意</title><desc id="desc">小維從西橋頭走84步，阿良從東橋頭走60步相遇，相遇後阿良再走70步到西橋頭</desc><rect width="720" height="300" rx="18" fill="#fff"/><text x="360" y="40" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700">吊橋相遇位置與步數</text><path d="M100 150H620" stroke="#455a64" stroke-width="14" stroke-linecap="round"/><path d="M100 110V195M620 110V195" stroke="#263238" stroke-width="5"/><circle cx="390" cy="150" r="14" fill="#e53935"/><g font-family="sans-serif" font-size="18" text-anchor="middle"><text x="100" y="225">西橋頭</text><text x="620" y="225">東橋頭</text><text x="390" y="115">相遇</text><text x="245" y="185">小維：84步</text><text x="505" y="185">阿良：60步</text><text x="245" y="265">相遇後阿良再走70步到西橋頭</text></g></svg>

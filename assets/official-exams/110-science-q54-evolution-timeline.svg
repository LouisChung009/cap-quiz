<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img"><title>恐龍與鳥類化石年代重疊圖</title><rect width="820" height="390" rx="22" fill="#f7fafc"/><text x="410" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#183247">化石生存年代（Ma，百萬年前）</text><text x="410" y="72" text-anchor="middle" font-size="14" fill="#547186">年代愈大代表愈早；時間由左向右愈接近現在</text><path d="M160 320H760" stroke="#496b80" stroke-width="3"/><g font-size="15" fill="#31556b" text-anchor="middle"><text x="180" y="350">160</text><text x="330" y="350">140</text><text x="480" y="350">120</text><text x="630" y="350">100</text><text x="750" y="350">60</text></g><g stroke="#496b80" stroke-width="2"><path d="M180 315v10M330 315v10M480 315v10M630 315v10M750 315v10"/></g><g font-size="17" fill="#183247"><text x="26" y="125">劍龍</text><text x="26" y="175">始祖鳥</text><text x="26" y="225">三角龍</text><text x="26" y="275">暴龍</text></g><g stroke-width="18" stroke-linecap="round"><path d="M218 120H255" stroke="#53a7a1"/><path d="M285 170H300" stroke="#7e78c7"/><path d="M720 220H743" stroke="#e39b4b"/><path d="M720 270H735" stroke="#d66b6b"/></g><g font-size="14" fill="#496b80"><text x="215" y="104">155–150</text><text x="270" y="154">151–149</text><text x="695" y="204">68–65</text><text x="690" y="254">68–66</text></g><rect x="28" y="365" width="15" height="15" rx="7" fill="#7e78c7"/><text x="52" y="378" font-size="14" fill="#496b80">始祖鳥屬於與現存鳥類相關的支系（甲）</text></svg>

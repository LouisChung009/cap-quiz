<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">半透膜物質擴散實驗</title><desc id="desc">試管內葡萄糖液以可透葡萄糖的膜封口，倒置於澱粉液中</desc><rect width="720" height="400" rx="18" fill="#fff"/><text x="360" y="38" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700">葡萄糖與澱粉的半透膜實驗</text><path d="M170 155H550V320Q550 345 525 345H195Q170 345 170 320Z" fill="#d9f2ff" stroke="#455a64" stroke-width="4"/><path d="M290 92H430V235L408 265H312L290 235Z" fill="#fff4cf" stroke="#455a64" stroke-width="4"/><path d="M290 92H430" stroke="#d32f2f" stroke-width="6" stroke-dasharray="7 5"/><g font-family="sans-serif" font-size="18" text-anchor="middle"><text x="360" y="180">葡萄糖液</text><text x="360" y="300">澱粉液</text><text x="360" y="80">半透膜</text><text x="360" y="378" font-size="15" fill="#444">葡萄糖可通過膜；澱粉不可通過</text></g><path d="M445 95L485 75" stroke="#333" stroke-width="2"/></svg>

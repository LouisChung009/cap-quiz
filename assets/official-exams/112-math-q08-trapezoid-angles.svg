<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">梯形角度關係圖</title><desc id="desc">梯形ABCD中AD平行BC，角ADC為140度，BD垂直CD</desc><rect width="720" height="400" rx="18" fill="#fff"/><text x="360" y="35" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700">梯形角度關係（示意圖）</text><path d="M175 105L535 105L455 310L175 310Z" fill="#eaf4ff" stroke="#263238" stroke-width="4"/><path d="M175 105L455 310" stroke="#d84315" stroke-width="4"/><path d="M436 310L436 291L455 291" fill="none" stroke="#333" stroke-width="3"/><g font-family="sans-serif" font-size="22" font-weight="700"><text x="150" y="100">A</text><text x="540" y="100">D</text><text x="460" y="335">C</text><text x="145" y="335">B</text></g><text x="486" y="145" font-size="19" font-family="sans-serif">140°</text><text x="360" y="360" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#444">AD ∥ BC　BD ⟂ CD（示意，非按比例）</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">兒童及少年保護規範黑板示意</title><desc id="desc">父母或監護人應禁止兒少吸菸飲酒嚼檳榔；業者應拒絕兒少進入不良場所，違者可處罰鍰。</desc>
  <rect width="900" height="330" rx="24" fill="#f4f7fb"/><rect x="42" y="28" width="816" height="262" rx="16" fill="#193c37" stroke="#8a633e" stroke-width="12"/><g fill="#f5f1d8" font-family="sans-serif"><text x="450" y="82" text-anchor="middle" font-size="31" font-weight="700">兒童及少年保護規範</text><text x="92" y="137" font-size="23">家長／監護人：禁止兒少吸菸、飲酒、嚼檳榔</text><text x="92" y="187" font-size="23">業者：拒絕兒少進入不良場所</text><text x="92" y="237" font-size="23">違反規定者：可處罰鍰</text></g><rect x="350" y="290" width="200" height="20" rx="8" fill="#8a633e"/>
</svg>

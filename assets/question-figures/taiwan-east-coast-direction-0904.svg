<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-labelledby="title desc">
  <title id="title">臺灣東部花蓮與臺東方向示意圖</title><desc id="desc">北向上方；花蓮在臺東以北，從臺東前往花蓮主要向北。</desc>
  <rect width="600" height="450" rx="24" fill="#f4f7fb"/><path d="M305 80c28 13 45 50 38 90-4 23 16 34 7 61-8 25-28 44-25 72 3 32-17 74-45 93-13 9-24-4-21-20 6-30-11-47-7-74 4-24-10-46-2-73 8-26-7-46 8-71 13-21 18-57 47-78 2-2 5-2 8 0z" fill="#93c5fd" stroke="#2563eb" stroke-width="5"/><path d="M444 153V76m0 0-17 25m17-25 17 25" stroke="#10273b" stroke-width="5" fill="none"/><text x="444" y="58" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#10273b">北</text><circle cx="322" cy="175" r="11" fill="#dc2626"/><circle cx="294" cy="333" r="11" fill="#16a34a"/><path d="M294 315L317 195" stroke="#7c3aed" stroke-width="5" stroke-dasharray="9 7"/><path d="M308 232l11-4-3 12" fill="none" stroke="#7c3aed" stroke-width="4"/><text x="350" y="180" font-family="sans-serif" font-size="23" fill="#10273b">花蓮</text><text x="320" y="350" font-family="sans-serif" font-size="23" fill="#10273b">臺東</text><text x="160" y="410" font-family="sans-serif" font-size="18" fill="#52667b">位置與路線為方向判斷示意，非比例地圖</text>
</svg>

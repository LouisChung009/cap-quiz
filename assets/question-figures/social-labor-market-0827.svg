<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">簡化勞動市場最低工資示意圖</title><desc id="desc">均衡月薪28000元；最低工資32000元高於均衡，在簡化供需模型中供給量大於需求量。</desc>
  <rect width="760" height="430" rx="24" fill="#f4f7fb"/><text x="380" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#10273b">勞動市場（簡化模型）</text><path d="M100 345V90M100 345H690" fill="none" stroke="#475569" stroke-width="4"/><text x="44" y="112" font-family="sans-serif" font-size="20" fill="#10273b">月薪</text><text x="600" y="385" font-family="sans-serif" font-size="20" fill="#10273b">勞動量</text><path d="M160 315L590 105" stroke="#0284c7" stroke-width="7"/><path d="M160 105L590 315" stroke="#ea580c" stroke-width="7"/><text x="510" y="126" font-family="sans-serif" font-size="21" fill="#0369a1">供給</text><text x="510" y="303" font-family="sans-serif" font-size="21" fill="#c2410c">需求</text><circle cx="375" cy="210" r="8" fill="#10273b"/><path d="M100 210H640" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"/><path d="M100 168H640" stroke="#7c3aed" stroke-width="5" stroke-dasharray="10 6"/><text x="112" y="202" font-family="sans-serif" font-size="18" fill="#334155">均衡 28,000</text><text x="112" y="158" font-family="sans-serif" font-size="18" fill="#6d28d9">最低工資 32,000</text><path d="M287 178V342M465 178V342" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/><path d="M287 326H465" stroke="#b91c1c" stroke-width="4"/><text x="376" y="356" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#991b1b">超額供給</text>
</svg>

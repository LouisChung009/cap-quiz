<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>管理員登入｜晨光學習指揮室</title>
  <link rel="stylesheet" href="./login.css?v=1.0.0">
</head>
<body>
  <main class="login-shell">
    <section class="brand-panel">
      <a href="../" class="back-link">← 回到刷題 App</a>
      <div class="brand-mark">芽</div>
      <p class="eyebrow">CAP QUIZ · PLATFORM OPS</p>
      <h1>晨光學習<br>指揮室</h1>
      <p>全平台學習資料只提供給被授權的管理員。學生資料以匿名代號呈現，協助支持學習，不作公開排名。</p>
      <ul><li>受保護的管理 API</li><li>最小化兒童資料蒐集</li><li>管理操作可稽核</li></ul>
    </section>
    <section class="login-card">
      <p class="eyebrow">管理員登入</p>
      <h2>歡迎回來</h2>
      <p class="copy">請使用具有平台管理員權限的帳號。</p>
      <form id="loginForm">
        <label>電子信箱<input id="email" type="email" autocomplete="email" required placeholder="admin@example.com"></label>
        <label>密碼<input id="password" type="password" autocomplete="current-password" required placeholder="輸入密碼"></label>
        <button id="loginButton" type="submit">安全登入後台</button>
        <p id="message" class="message" role="status"></p>
      </form>
      <p class="setup-note">尚未設定 Supabase？目前請使用 <a href="./">互動原型</a> 預覽看板。</p>
    </section>
  </main>
  <script src="./config.js?v=1.1.0"></script>
  <script type="module" src="./login.js?v=1.0.0"></script>
</body>
</html>

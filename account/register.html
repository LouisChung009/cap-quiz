<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="./account.css?v=1"><title>建立帳號｜會考刷題</title></head><body><main class="auth-shell"><a class="brand" href="../">← 會考刷題 <span>V2</span></a><section class="auth-card"><div class="leaf">🌰</div><p class="eyebrow">種下你的學習種子</p><h1>建立學習帳號</h1><p class="intro">由家長或監護人陪同建立，讓學習記錄能安全同步。</p><form data-auth-flow="register"><label>學習暱稱<input name="displayName" maxlength="30" autocomplete="nickname" required placeholder="例如：小芽"></label><label>監護人電子郵件<input name="email" type="email" autocomplete="email" required placeholder="guardian@example.com"></label><label>設定密碼<input name="password" type="password" autocomplete="new-password" required minlength="12" placeholder="至少 12 個字元"></label><label class="check"><input type="checkbox" required> 我已閱讀並同意監護人資料與未成年人隱私說明。</label><button>建立受保護帳號</button></form><div class="auth-links"><a href="./login.html">已有帳號，前往登入</a></div><p class="notice" data-message>正式啟用時會先寄出驗證信；未驗證的帳號不能存取平台學習資料。</p></section><footer><a href="../privacy.html">隱私權</a><a href="../terms.html">服務條款</a><a href="../help.html">幫助中心</a></footer></main><script src="./account.js?v=1" defer></script></body></html>

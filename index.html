<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#172033">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>會考刷題 V2</title>
</head>
<body>
  <main class="app">
    <header><div><div class="brand">會考刷題 <span>V2</span></div><div class="subtitle">五科 5,000 題・進度只存在本機</div></div><div class="pill" id="todayCount">今日 0 題</div></header>
    <nav class="tabs" id="subjectTabs" aria-label="科目"></nav>
    <section class="card filters" aria-label="題目篩選">
      <label>難度<select id="difficultyFilter"><option value="">全部難度</option><option>基礎</option><option>中等</option><option>進階</option></select></label>
      <label>單元<select id="unitFilter"><option value="">全部單元</option></select></label>
      <button class="filter-button" id="resetFilters" type="button">清除篩選</button>
    </section>
    <section class="card quiz-card" aria-live="polite">
      <div id="loading" class="loading">正在載入題庫…</div>
      <div id="quiz" class="hidden">
        <div class="meta" id="meta"></div><div class="question" id="question"></div><div class="options" id="options"></div>
        <div id="feedback" class="feedback hidden"></div>
        <div class="actions"><button class="button secondary" id="wrongButton" type="button">只刷錯題</button><button class="button" id="mainButton" type="button">確認答案</button></div>
      </div>
      <div id="empty" class="empty hidden">目前篩選條件沒有題目，請調整難度或單元。</div>
    </section>
    <section class="stats"><div class="stat"><div class="number" id="doneCount">0</div><div class="label">累計作答</div></div><div class="stat"><div class="number" id="accuracy">—</div><div class="label">正確率</div></div><div class="stat"><div class="number" id="wrongCount">0</div><div class="label">錯題待複習</div></div></section>
    <section class="card note"><b>使用方式</b><p>題目為原創會考程度練習題，不冒充官方歷屆真題。可依科目、難度與單元篩選；答錯會自動加入錯題庫。作答紀錄與複習資料只保存在這台裝置。</p></section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>

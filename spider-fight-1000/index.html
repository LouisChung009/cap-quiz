1;color:#26190b}#webStorm{background:#b9f3ff;color:#12344c}#ultimate:disabled,#webStorm:disabled{opacity:.4}#reset{background:#2f415a;color:#fff}.meter{height:10px;background:#364154;border-radius:5px;overflow:hidden;flex:1;min-width:80px}.meter>div{height:100%;background:#ffe171;width:0}small{display:block;text-align:center;color:#bfcce1;margin:12px auto;line-height:1.5}@media(max-width:480px){main{padding:7px}.ctrl{gap:5px}.ctrl button{min-height:56px;font-size:13px}header{font-size:12px}#message{font-size:24px}}/* Tablet-first fighting-game viewport and in-arena touch controls */

<body><main><h1>🕷️ 蜘蛛英雄 VS 深海八爪魔王 🐙<br><span style="font-size:.52em;color:#ffdd7c">1500 HP 魔王・全觸手必殺版</span></h1><header><span>你：蜘蛛英雄 ❤️ <span id="heroHpText">500 / 500 HP</span></span><span id="round">第 1 關：聖誕樹小弟</span><span>八爪魔王 🛡️ <span id="bossHpText">1500 / 1500 HP</span></span></header><div class="bars"><div class="bar"><div class="fill" id="hp" style="width:100%"></div></div><div class="bar"><div class="fill" id="ep" style="width:100%"></div></div></div><div id="stage"><button id="zoom" type="button" aria-label="放大戰鬥螢幕" aria-pressed="false">⛶ 放大</button><canvas id="game" width="900" height="510" aria-label="蜘蛛英雄與八爪魔王的格鬥遊戲"></canvas><div class="battle-pad"><div class="ctrl" aria-label="移動與跳躍"><button type="button" data-action="left" aria-label="向左移動">◀</button><button type="button" data-action="right" aria-label="向右移動">▶</button><button type="button" data-action="jump">⬆ 跳</button></div><div class="actions"><button type="button" data-action="punch">👊 拳擊</button><button type="button" data-action="web">🕸 蜘蛛網</button><button type="button" id="webStorm">🕸 連射網</button><button type="button" id="ultimate">⚡ 風暴</button><button type="button" id="heal">💚 治癒</button><button type="button" id="swing">🪢 飛躍</button></div></div><div id="overlay"><div id="message">準備好當蜘蛛英雄了嗎？</div><button id="start">▶ 開始戰鬥</button><span>按開始戰鬥，擊退八爪魔王與兩個邪惡聖誕樹小弟！</span></div></div><div class="lower"><b>⚡ 大招能量</b><div class="meter"><div id="energy"></div></div><strong id="energyValue">0%</strong><button type="button" id="reset">↻ 重新開始</button></div><small id="tip">按戰鬥框右上角「⛶ 放大」進入滿版模式；左邊移動跳躍、右邊拳擊／蜘蛛網／蜘蛛風暴／連射網／治癒／飛躍，放大後全部仍在同一畫面內。電腦：方向鍵、空白鍵、Z、X（蜘蛛風暴）、C（蜘蛛網連射）、H（治療）、F（飛躍）。</small></main>
<script>
(()=>{'use strict';const el=id=>document.getElementById(id),canvas=el('game'),c=canvas.getContext('2d'),W=900,G=420;let p,m,trees=[],bullets,fx,power=0,barrageTicks=0,playing=false,ended=false,tick=0,phase=1,phaseIntro=0,raf=0,last=0,hold={left:false,right:false};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function reset(){el('tip').textContent='第一關：先打倒兩隻 150 HP 聖誕樹小弟。第二關：挑戰 1500 HP 八爪章魚魔王！';cancelAnimationFrame(raf);p={x:170,y:G,vy:0,hp:500,maxHp:500,face:1,cool:0,attack:0,blink:0,healCd:0,swingCd:0,swingLeft:0,swingFrom:0,swingTo:0,invuln:0,healUses:3,hitSafe:0};m={x:705,y:G,hp:1500,maxHp:1500,cool:65,shotCd:105,attack:0,blink:0,ultimateUsed:false,ultimateWarn:0,ultimateStrike:0,deathFrame:0,deathDone:false};trees=[{x:490,y:G,hp:150,respawn:0,cd:55,role:0},{x:840,y:G,hp:150,respawn:0,cd:105,role:1}];bullets=[];fx=[];tick=0;phase=1;phaseIntro=0;power=0;barrageTicks=0;playing=false;ended=false;hold.left=hold.right=false;el('overlay').style.display='flex';el('message').textContent='準備好當蜘蛛英雄了嗎？';el('start').textContent='▶ 開始戰鬥';update();draw()}function update(){el('hp').style.width=(p.hp/p.maxHp*100)+'%';el('heroHpText').textContent=Math.ceil(p.hp)+' / '+p.maxHp+' HP';el('ep').style.width=(phase===1?0:m.hp/m.maxHp*100)+'%';el('round').textContent=phase===1?'第 1 關：聖誕樹小弟':'第 2 關：八爪章魚魔王';el('bossHpText').textContent=phase===1?'🔒 第二關解鎖':m.hp+' / '+m.maxHp+' HP'+(m.hp===0?' 💀倒下':m.hp<=750?' 🔥狂暴':'');el('energy').style.width=power+'%';el('energyValue').textContent=Math.floor(power)+'%';el('heal').disabled=!playing||p.healCd>0||p.hp>=p.maxHp||p.healUses<=0;el('heal').textContent=p.healUses<=0?'💚 用完':p.healCd>0?'💚 '+Math.ceil(p.healCd/60)+'秒':'💚 治癒×'+p.healUses;el('swing').disabled=!playing||p.swingCd>0||p.swingLeft>0;el('swing').textContent=p.swingCd>0?'🪢 '+Math.ceil(p.swingCd/60)+'秒':'🪢 飛躍';el('ultimate').disabled=!playing;el('ultimate').textContent=power>=50?'⚡ 風暴！':'⚡ 風暴 '+Math.floor(power)+'/50';el('ultimate').style.background=power>=50?'#ff8e3d':'#ffe171';el('webStorm').disabled=!playing||barrageTicks>0;el('webStorm').textContent=barrageTicks>0?'🕸 連射中':power>=50?'🕸 連射！':'🕸 '+Math.floor(power)+'/50';el('webStorm').style.background=power>=50?'#61e4ff':'#a8d8e7';el('webStorm').style.borderColor=power>=50?'#0799cd':'#5f9aae'}function start(){if(ended)reset();playing=true;el('overlay').style.display='none';last=performance.now();update();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function victoryCheck(){if(!playing)return;if(phase===1&&trees.every(t=>t.hp===0)){phase=2;phaseIntro=120;bullets=[];barrageTicks=0;p.invuln=Math.max(p.invuln,125);m.cool=85;m.shotCd=155;el('tip').textContent='🎉 第一關通過！第二關：八爪章魚魔王出現！準備迎接 1500 HP 魔王！';blast(m.x,m.y-150,'#f8c17f',32);update();return}if(phase===2&&m.hp===0&&m.deathDone)finish(true)}function finish(win){if(ended)return;playing=false;ended=true;cancelAnimationFrame(raf);hold.left=hold.right=false;el('overlay').style.display='flex';el('message').textContent=win?'🏆 兩關全破！你贏了！':'💥 再挑戰一次！';el('start').textContent='↻ 再玩一次';el('tip').textContent=win?'🎄 第一關小弟全倒下、🐙 第二關魔王也被擊敗！':'這場輸了！善用跳躍、蜘蛛絲飛躍和三次治癒，可以再挑戰。';update()}function blast(x,y,col,n=12){for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*15,vy:(Math.random()-.5)*15,t:20,col})}function damageHero(amount,color){if(!playing||p.invuln>0||p.hitSafe>0)return false;p.hp=clamp(p.hp-amount,0,p.maxHp);p.hitSafe=22;p.blink=17;blast(p.x,p.y-110,color,13);if(p.hp===0){finish(false)}else if(p.hp<=90){el('tip').textContent='⚠️ 生命危險！跳躍、飛躍躲開攻擊，善用有限的治癒術！'}update();return true}function hurtMonster(d,gainEnergy=true){if(!playing||phase!==2||phaseIntro>0||m.hp===0)return;m.hp=clamp(m.hp-d,0,m.maxHp);m.blink=10;if(gainEnergy)power=clamp(power+20,0,100);blast(m.x,m.y-110,'#fce28d');if(m.hp===0){m.deathFrame=1;m.deathDone=false;m.ultimateWarn=0;m.ultimateStrike=0;el('tip').textContent='🐙 魔王倒下了！兩關挑戰完成！';}victoryCheck();update()}function hurtTree(tree,d){if(!playing||tree.hp<=0)return;tree.hp=Math.max(0,tree.hp-d);blast(tree.x,tree.y-100,'#9af87a',9);power=

1;color:#26190b}#webStorm{background:#b9f3ff;color:#12344c}#ultimate:disabled,#webStorm:disabled{opacity:.4}#reset{background:#2f415a;color:#fff}.meter{height:10px;background:#364154;border-radius:5px;overflow:hidden;flex:1;min-width:80px}.meter>div{height:100%;background:#ffe171;width:0}small{display:block;text-align:center;color:#bfcce1;margin:12px auto;line-height:1.5}@media(max-width:480px){main{padding:7px}.ctrl{gap:5px}.ctrl button{min-height:56px;font-size:13px}header{font-size:12px}#message{font-size:24px}}/* Tablet-first fighting-game viewport and in-arena touch controls */

<body><main><h1>🕷️ 蜘蛛英雄 VS 深海八爪魔王 🐙<br><span style="font-size:.52em;color:#ffdd7c">1000 HP 魔王・全觸手必殺版</span></h1><header><span>你：蜘蛛英雄 ❤️ <span id="heroHpText">500 / 500 HP</span></span><span id="round">第 1 回合</span><span>八爪魔王 🛡️ <span id="bossHpText">1000 / 1000 HP</span></span></header><div class="bars"><div class="bar"><div class="fill" id="hp" style="width:100%"></div></div><div class="bar"><div class="fill" id="ep" style="width:100%"></div></div></div><div id="stage"><canvas id="game" width="900" height="510" aria-label="蜘蛛英雄與八爪魔王的格鬥遊戲"></canvas><div class="battle-pad"><div class="ctrl" aria-label="移動與跳躍"><button type="button" data-action="left" aria-label="向左移動">◀</button><button type="button" data-action="right" aria-label="向右移動">▶</button><button type="button" data-action="jump">⬆ 跳</button></div><div class="actions"><button type="button" data-action="punch">👊 拳擊</button><button type="button" data-action="web">🕸 蜘蛛網</button><button type="button" id="webStorm">🕸 連射網</button><button type="button" id="ultimate">⚡ 風暴</button><button type="button" id="heal">💚 治癒</button><button type="button" id="swing">🪢 飛躍</button></div></div><div id="overlay"><div id="message">準備好當蜘蛛英雄了嗎？</div><button id="start">▶ 開始戰鬥</button><span>按開始戰鬥，擊退八爪魔王與兩個邪惡聖誕樹小弟！</span></div></div><div class="lower"><b>⚡ 大招能量</b><div class="meter"><div id="energy"></div></div><strong id="energyValue">0%</strong><button type="button" id="reset">↻ 重新開始</button></div><small id="tip">平板操作：左下角方向／跳躍，右下角攻擊／蜘蛛網／兩種大招／治療／飛躍，所有按鈕都在戰鬥畫面中。電腦：方向鍵、空白鍵、Z、X（蜘蛛風暴）、C（蜘蛛網連射）、H（治療）、F（飛躍）。</small></main>
<script>
(()=>{'use strict';const el=id=>document.getElementById(id),canvas=el('game'),c=canvas.getContext('2d'),W=900,G=420;let p,m,trees=[],bullets,fx,power=0,barrageTicks=0,playing=false,ended=false,tick=0,raf=0,last=0,hold={left:false,right:false};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function reset(){el('tip').textContent='蜘蛛英雄 500 HP、可治癒 3 次、有兩種大招！魔王有一次全觸手必殺！出現警告時跳高或飛躍躲避。';cancelAnimationFrame(raf);p={x:170,y:G,vy:0,hp:500,maxHp:500,face:1,cool:0,attack:0,blink:0,healCd:0,swingCd:0,swingLeft:0,swingFrom:0,swingTo:0,invuln:0,healUses:3,hitSafe:0};m={x:705,y:G,hp:1000,maxHp:1000,cool:65,shotCd:105,attack:0,blink:0,ultimateUsed:false,ultimateWarn:0,ultimateStrike:0,deathFrame:0,deathDone:false};trees=[{x:490,y:G,hp:100,respawn:0,cd:55,role:0},{x:840,y:G,hp:100,respawn:0,cd:105,role:1}];bullets=[];fx=[];tick=0;power=0;barrageTicks=0;playing=false;ended=false;hold.left=hold.right=false;el('overlay').style.display='flex';el('message').textContent='準備好當蜘蛛英雄了嗎？';el('start').textContent='▶ 開始戰鬥';update();draw()}function update(){el('hp').style.width=(p.hp/p.maxHp*100)+'%';el('heroHpText').textContent=Math.ceil(p.hp)+' / '+p.maxHp+' HP';el('ep').style.width=(m.hp/m.maxHp*100)+'%';el('bossHpText').textContent=m.hp+' / '+m.maxHp+' HP'+(m.hp===0?' 💀倒下':m.hp<=500?' 🔥狂暴':'');el('energy').style.width=power+'%';el('energyValue').textContent=Math.floor(power)+'%';el('heal').disabled=!playing||p.healCd>0||p.hp>=p.maxHp||p.healUses<=0;el('heal').textContent=p.healUses<=0?'💚 用完':p.healCd>0?'💚 '+Math.ceil(p.healCd/60)+'秒':'💚 治癒×'+p.healUses;el('swing').disabled=!playing||p.swingCd>0||p.swingLeft>0;el('swing').textContent=p.swingCd>0?'🪢 '+Math.ceil(p.swingCd/60)+'秒':'🪢 飛躍';el('ultimate').disabled=!playing;el('ultimate').textContent=power>=50?'⚡ 風暴！':'⚡ 風暴 '+Math.floor(power)+'/50';el('ultimate').style.background=power>=50?'#ff8e3d':'#ffe171';el('webStorm').disabled=!playing||barrageTicks>0;el('webStorm').textContent=barrageTicks>0?'🕸 連射中':power>=50?'🕸 連射！':'🕸 '+Math.floor(power)+'/50';el('webStorm').style.background=power>=50?'#61e4ff':'#a8d8e7';el('webStorm').style.borderColor=power>=50?'#0799cd':'#5f9aae'}function start(){if(ended)reset();playing=true;el('overlay').style.display='none';last=performance.now();update();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function finish(win){if(win&&!m.deathDone){playing=false;ended=true;hold.left=hold.right=false;m.deathFrame=1;el('tip').textContent='🐙 魔王被擊敗了！正在倒下……';cancelAnimationFrame(raf);requestAnimationFrame(deathAnimation);return}playing=false;ended=true;cancelAnimationFrame(raf);hold.left=hold.right=false;el('overlay').style.display='flex';el('message').textContent=win?'🏆 你贏了！':'💥 再挑戰一次！';el('start').textContent='↻ 再玩一次';el('tip').textContent=win?'蜘蛛英雄成功擊敗八爪魔王！':'這場輸了！善用跳躍、蜘蛛絲飛躍和三次治癒，可以再挑戰。';update()}function deathAnimation(){if(m.deathDone)return;m.deathFrame++;draw();if(m.deathFrame<95){raf=requestAnimationFrame(deathAnimation)}else{m.deathDone=true;finish(true)}}function blast(x,y,col,n=12){for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*15,vy:(Math.random()-.5)*15,t:20,col})}function damageHero(amount,color){if(!playing||p.invuln>0||p.hitSafe>0)return false;p.hp=clamp(p.hp-amount,0,p.maxHp);p.hitSafe=22;p.blink=17;blast(p.x,p.y-110,color,13);if(p.hp===0){finish(false)}else if(p.hp<=90){el('tip').textContent='⚠️ 生命危險！跳躍、飛躍躲開攻擊，善用有限的治癒術！'}update();return true}function hurtMonster(d,gainEnergy=true){if(!playing)return;m.hp=clamp(m.hp-d,0,m.maxHp);m.blink=10;if(gainEnergy)power=clamp(power+20,0,100);blast(m.x,m.y-110,'#fce28d');if(m.hp===0)finish(true);update()}function hurtTree(tree,d){if(!playing||tree.hp<=0)return;tree.hp=Math.max(0,tree.hp-d);blast(tree.x,tree.y-100,'#9af87a',9);power=clamp(power+8,0,100);if(tree.hp===0){tree.respawn=300;blast(tree.x,tree.y-110,'#faff76',25)}update()}function action(a){if(!playing)return;if(a==='jump'){if(p.y===G){p.vy=-17;p.y-=1}}else if(a==='punch'){if(p.cool)return;p.cool=19;p.attack=14;power=clamp(power+8,0,100);update();p.face=m.x>p.x?1:-1;if(Math.abs(m.x-p.x)<125&&Math.abs(p.y-m.y)<75)hurtMonster(12);else{const target=trees.find(t=>t.hp>0&&Math.abs(t.x-p.x)<110&&Math.abs(t.y-p.y)<75);if(target)hurtTree(target,18)}}else if(a==='web'){if(p.cool)return;p.cool=25;p.attack=12;power=clamp(power+8,0,100);update();p.face=m.x>p.x?1:-1;bullets.push({x:p.x+p.face*48,y:p.y-115,v:p.face*14,t:70,d:17,r:22})}}function heal(){if(!playing)return;if(p.healUses<=0){el('tip').textContent='💚 本回合的三次治癒已用完，請小心躲避！';return}if(p.healCd>0){el('tip').textContent='💚 治癒術還在冷卻！';return}if(p.hp>=p.maxHp){el('tip').textContent='你的生命值已經滿了！';return}p.hp=clamp(p.hp+70,0,p.maxHp);p.healUses--;p.healCd=600;blast(p.x,p.y-110,'#70ffab',24);el('tip').textContent='💚 身體修復完成！恢復 70 HP；10 秒後可再使用。';update()}function swing(){if(!playing||p.swingCd>0||p.swingLeft>0)return;p.swingFrom=p.x;p.swingTo=p.x<W/2?W-95:95;p.swingLeft=40;p.swingCd=360;p.invuln=43;p.vy=0;blast(p.x,p.y-125,'#baf5ff',18);el('tip').textContent='🕸️ 蜘蛛絲發射！吊起後飛到戰場另一邊，飛行期間不受傷害。';update()}function ultimate(){if(!playing)return;if(power<50){el('tip').textContent='⚡ 再攻擊幾下！大招需要 50% 能量，目前 '+Math.floor(power)+'%。';return;}power=0;el('tip').textContent='💥 蜘蛛風暴發動！下次大招要重新累積到 50%！';p.attack=25;const dir=m.x>p.x?1:-1;for(let i=-2;i<=2;i++)bullets.push({x:p.x,y:p.y-120+i*21,v:dir*15,t:72,d:13,r:30,special:true});update()}function webStorm(){if(!playing||barrageTicks>0)return;if(power<50){el('tip').textContent='🕸️ 連射蜘蛛網需要 50% 能量，目前 '+Math.floor(power)+'%。';return}power=0;barrageTicks=120;el('tip').textContent='🕸️ 蜘蛛網暴雨！連續射擊 2 秒！結束後要重新累積 50% 能量。';blast(p.x,p.y-120,'#b4f5ff',20);update()}function step(){tick++;if(barrageTicks>0){barrageTicks--;if(barrageTicks%6===0){const dir=m.x>=p.x?1:-1;p.face=dir;p.attack=8;bullets.push({x:p.x+dir*48,y:p.y-115+Math.sin(tick*.6)*20,v:dir*17,t:75,d:12,r:13,special:true,webRain:true});if(barrageTicks%24===0)blast(p.x+dir*42,p.y-110,'#d5faff',3)}if(barrageTicks===0)el('tip').textContent='🕸️ 連射結束！再次累積 50% 能量後可以重新施放。'}if(p.healCd>0)p.healCd--;if(p.swingCd>0)

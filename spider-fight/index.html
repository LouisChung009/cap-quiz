<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101b32"><meta name="apple-mobile-web-app-capable" content="yes"><title>蜘蛛英雄 VS 深海八爪魔王</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080e1d;color:#fff;font:16px system-ui,-apple-system,sans-serif}main{max-width:960px;margin:auto;padding:12px}h1{font-size:clamp(18px,4vw,30px);margin:3px 0 12px;text-align:center}header,.bars,.ctrl,.lower{display:flex;align-items:center;gap:10px;justify-content:space-between}header{font-size:14px;font-weight:800}.bars{margin:6px 0 8px}.bar{height:13px;background:#273047;border-radius:20px;overflow:hidden;width:48%;border:1px solid #8090a5}.fill{height:100%;transition:width .15s}#hp{background:#4be1a8}#ep{background:#ff6575}#stage{position:relative;border:2px solid #48617d;border-radius:16px;overflow:hidden;background:#173b57}canvas{display:block;width:100%;height:auto;touch-action:none}#overlay{position:absolute;inset:0;background:#081020d9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:15px}#message{font-size:clamp(24px,5vw,42px);font-weight:900}button{border:0;border-radius:14px;min-height:57px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;font-size:16px}button:active{transform:scale(.96)}#start{padding:10px 38px;background:#ffe171;color:#151515;font-size:22px}.ctrl{margin:12px 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.ctrl button{padding:6px 2px;background:#c7e8fc;color:#132235}.ctrl button:nth-child(4){background:#f9c28d}.ctrl button:nth-child(5){background:#d4bafa}.lower{gap:10px;flex-wrap:wrap}.lower button{padding:10px 14px}#ultimate{flex:1;background:#ffe171;color:#26190b}#ultimate:disabled{opacity:.4}#reset{background:#2f415a;color:#fff}.meter{height:10px;background:#364154;border-radius:5px;overflow:hidden;flex:1;min-width:80px}.meter>div{height:100%;background:#ffe171;width:0}small{display:block;text-align:center;color:#bfcce1;margin:12px auto;line-height:1.5}@media(max-width:480px){main{padding:7px}.ctrl{gap:5px}.ctrl button{min-height:56px;font-size:13px}header{font-size:12px}#message{font-size:24px}}</style></head>
<body><main><h1>🕷️ 蜘蛛英雄 VS 深海八爪魔王 🐙</h1><header><span>你：蜘蛛英雄</span><span id="round">第 1 回合</span><span>八爪魔王 🛡️ 250 HP</span></header><div class="bars"><div class="bar"><div class="fill" id="hp" style="width:100%"></div></div><div class="bar"><div class="fill" id="ep" style="width:100%"></div></div></div><div id="stage"><canvas id="game" width="900" height="510" aria-label="蜘蛛英雄與八爪魔王的格鬥遊戲"></canvas><div id="overlay"><div id="message">準備好當蜘蛛英雄了嗎？</div><button id="start">▶ 開始戰鬥</button><span>點按下方按鈕，打敗八爪魔王！</span></div></div><div class="ctrl"><button data-action="left">◀ 左</button><button data-action="right">右 ▶</button><button data-action="jump">⬆ 跳</button><button data-action="punch">👊 拳</button><button data-action="web">🕸 網</button></div><div class="lower"><b>⚡ 能量（50%可施放）</b><div class="meter"><div id="energy"></div></div><strong id="energyValue">0%</strong><button id="ultimate" disabled>⚡ 必殺技（50%）</button><button id="reset">重新開始</button></div><small id="tip">平板：長按方向鍵移動；點按拳擊、蜘蛛網、跳躍。電腦：方向鍵、空白鍵、Z、X。</small></main>
<script>
(()=>{'use strict';const el=id=>document.getElementById(id),canvas=el('game'),c=canvas.getContext('2d'),W=900,G=420;let p,m,bullets,fx,power=0,playing=false,ended=false,tick=0,raf=0,last=0,hold={left:false,right:false};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function reset(){el('tip').textContent='擊中怪物累積能量，50% 就能放大招！';cancelAnimationFrame(raf);p={x:170,y:G,vy:0,hp:100,face:1,cool:0,attack:0,blink:0};m={x:705,y:G,hp:250,maxHp:250,cool:65,attack:0,blink:0};bullets=[];fx=[];tick=0;power=0;playing=false;ended=false;hold.left=hold.right=false;el('overlay').style.display='flex';el('message').textContent='準備好當蜘蛛英雄了嗎？';el('start').textContent='▶ 開始戰鬥';update();draw()}function update(){el('hp').style.width=p.hp+'%';el('ep').style.width=(m.hp/m.maxHp*100)+'%';el('energy').style.width=power+'%';el('energyValue').textContent=Math.floor(power)+'%';el('ultimate').disabled=!playing;el('ultimate').textContent=power>=50?'⚡ 放大招！':'⚡ 大招 '+Math.floor(power)+'/50%';el('ultimate').style.background=power>=50?'#ff8e3d':'#ffe171'}function start(){if(ended)reset();playing=true;el('overlay').style.display='none';last=performance.now();update();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function finish(win){playing=false;ended=true;cancelAnimationFrame(raf);hold.left=hold.right=false;el('overlay').style.display='flex';el('message').textContent=win?'🏆 你贏了！':'💥 再挑戰一次！';el('start').textContent='↻ 再玩一次';el('tip').textContent=win?'蜘蛛英雄成功擊敗八爪魔王！':'技巧：保持距離，使用蜘蛛網可以安全攻擊。';update()}function blast(x,y,col,n=12){for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*15,vy:(Math.random()-.5)*15,t:20,col})}function hurtMonster(d){if(!playing)return;m.hp=clamp(m.hp-d,0,m.maxHp);m.blink=10;power=clamp(power+20,0,100);blast(m.x,m.y-110,'#fce28d');if(m.hp===0)finish(true);update()}function action(a){if(!playing)return;if(a==='jump'){if(p.y===G){p.vy=-17;p.y-=1}}else if(a==='punch'){if(p.cool)return;p.cool=19;p.attack=14;power=clamp(power+8,0,100);update();p.face=m.x>p.x?1:-1;if(Math.abs(m.x-p.x)<125&&Math.abs(p.y-m.y)<75)hurtMonster(12)}else if(a==='web'){if(p.cool)return;p.cool=25;p.attack=12;power=clamp(power+8,0,100);update();p.face=m.x>p.x?1:-1;bullets.push({x:p.x+p.face*48,y:p.y-115,v:p.face*14,t:70,d:17,r:22})}}function ultimate(){if(!playing)return;if(power<50){el('tip').textContent='⚡ 再攻擊幾下！大招需要 50% 能量，目前 '+Math.floor(power)+'%。';return;}power-=50;el('tip').textContent='💥 蜘蛛風暴！超級必殺技發動！';p.attack=25;const dir=m.x>p.x?1:-1;for(let i=-2;i<=2;i++)bullets.push({x:p.x,y:p.y-120+i*21,v:dir*15,t:72,d:13,r:30});update()}function step(){tick++;if(hold.left){p.x-=5.3;p.face=-1}if(hold.right){p.x+=5.3;p.face=1}p.x=clamp(p.x,42,W-42);p.vy+=.85;p.y=Math.min(G,p.y+p.vy);if(p.y===G)p.vy=0;p.cool=Math.max(0,p.cool-1);p.attack=Math.max(0,p.attack-1);p.blink=Math.max(0,p.blink-1);m.blink=Math.max(0,m.blink-1);m.attack=Math.max(0,m.attack-1);m.cool--;const distance=p.x-m.x;if(Math.abs(distance)>120)m.x+=Math.sign(distance)*2.0;else if(m.cool<=0){m.cool=52+Math.floor(Math.random()*33);m.attack=19;if(Math.abs(distance)<140&&Math.abs(p.y-m.y)<85){p.hp=clamp(p.hp-10,0,100);p.blink=14;blast(p.x,p.y-110,'#a6e8ff');if(p.hp===0)finish(false)}}m.x=clamp(m.x,65,W-65);for(const b of bullets){b.x+=b.v;b.t--;if(Math.abs(b.x-m.x)<65&&Math.abs(b.y-(m.y-105))<100){b.t=0;hurtMonster(b.d);blast(b.x,b.y,'#d6faff',18)}}bullets=bullets.filter(b=>b.t>0&&b.x>0&&b.x<W);for(const x of fx){x.x+=x.vx;x.y+=x.vy;x.vy+=.35;x.t--}fx=fx.filter(x=>x.t>0);if(tick%6===0)update()}function loop(now){if(!playing)return;const n=Math.min(3,Math.max(1,Math.round((now-last)/16.67)));last=now;for(let i=0;i<n&&playing;i++)step();draw();if(playing)raf=requestAnimationFrame(loop)}function ellipse(x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,7);c.fill()}function stroke(points,color,width){c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(...points[0]);for(let i=1;i<points.length;i++)c.lineTo(...points[i]);c.stroke()}function spider(){c.save();c.translate(p.x,p.y);c.scale(p.face,1);if(p.blink%4>1)c.globalAlpha=.45;const bob=p.y===G?Math.sin(tick*.15)*3:0;c.translate(0,bob);stroke([[-17,-67],[-28,-27],[-42,0]],'#172c69',25);stroke([[17,-67],[28,-27],[42,0]],'#172c69',25);stroke([[-42,-1],[-22,-1]],'#db313e',15);stroke([[42,-1],[22,-1]],'#db313e',15);ellipse(0,-105,41,67,'#e8343d');ellipse(0,-78,33,27,'#173d83');stroke([[-33,-146],[-49,-108],[-64,-91]],'#183d84',22);stroke([[33,-146],[49,-110],[65+(p.attack?35:0),-94]],'#183d84',22);ellipse(-64,-91,14,15,'#ee333b');ellipse(65+(p.attack?35:0),-94,14,15,'#ee333b');ellipse(0,-193,38,43,'#e9363c');for(let i=-25;i<=25;i+=12)stroke([[i,-227],[i*.7,-154]],'#421d32',1.4);for(let y=-224;y<=-160;y+=13)stroke([[-29,y],[29,y]],'#421d32',1.4);c.fillStyle='#fff';c.strokeStyle='#1b2336';c.lineWidth=4;for(const s of [-1,1]){c.beginPath();c.moveTo(s*4,-195);c.quadraticCurveTo(s*19,-215,s*34,-202);c.quadraticCurveTo(s*24,-183,s*7,-184);c.closePath();c.fill();c.stroke()}c.textAlign='center';c.font='38px sans-serif';c.fillStyle='#121c36';c.fillText('🕷',0,-105);c.restore()}function monster(){c.save();c.translate(m.x,m.y);if(m.blink%4>1)c.globalAlpha=.45;for(let i=0;i<8;i++){const a=i/7*Math.PI;let sx=Math.cos(a)*55,ex=Math.cos(a)*145;stroke([[sx,-125],[sx+ex*.25,-75+Math.sin(tick*.08+i)*17],[ex,-4-Math.sin(tick*.08+i)*13]],'#86543c',34);stroke([[sx,-125],[sx+ex*.25,-75+Math.sin(tick*.08+i)*17],[ex,-4-Math.sin(tick*.08+i)*13]],'#c58d60',20)}ellipse(0,-145,89,112,'#85553f');ellipse(0,-143,75,94,'#bf8b5f');c.fillStyle='#9c664a';c.beginPath();c.moveTo(-81,-195);c.lineTo(0,-295);c.lineTo(81,-195);c.closePath();c.fill();stroke([[-80,-195],[0,-295],[80,-195]],'#ecc796',10);for(const side of [-1,1]){ellipse(side*48,-174,32,40,'#e8e196');ellipse(side*48,-174,17,28,'#24231d');ellipse(side*53,-187,6,8,'#fff')}for(let i=-2;i<=2;i++){stroke([[i*29,-121],[i*37,-55],[i*40,-2]],'#b77f57',27)}if(m.attack>0)stroke([[-77,-155],[-130,-164],[-181,-117]],'#e7b67e',32);c.restore()}function draw(){const grad=c.createLinearGradient(0,0,0,510);grad.addColorStop(0,'#071229');grad.addColorStop(.7,'#28516c');grad.addColorStop(1,'#1e3348');c.fillStyle=grad;c.fillRect(0,0,900,510);for(let i=0;i<12;i++){let x=i*91-25,h=190+(i%4)*25;c.fillStyle=i%2?'#173550':'#21415b';c.fillRect(x,G-h,78,h);for(let j=0;j<3;j++)for(let k=0;k<4;k++){c.fillStyle='#5a8b9a';c.fillRect(x+12+j*19,G-h+27+k*35,8,16)}}c.fillStyle='#253340';c.fillRect(0,G,900,100);stroke([[0,G],[900,G]],'#9da9b1',3);for(let i=0;i<14;i++)stroke([[i*85,G],[i*85-35,510]],'#425566',2);ellipse(p.x,G+7,50,9,'#0b1b2b');ellipse(m.x,G+8,80,12,'#0b1b2b');monster();spider();for(const b of bullets){c.strokeStyle='#e4f9ff';c.lineWidth=5;c.beginPath();c.arc(b.x,b.y,b.r,0,7);c.stroke();for(let i=0;i<6;i++){let a=i*Math.PI/3;stroke([[b.x,b.y],[b.x+Math.cos(a)*b.r,b.y+Math.sin(a)*b.r]],'#bdf5ff',3)}}for(const f of fx)ellipse(f.x,f.y,4,4,f.col);c.textAlign='center';c.font='bold 20px sans-serif';c.fillStyle='#fff';c.fillText('你',p.x,p.y-252);c.fillText('魔王',m.x,m.y-310)}document.querySelectorAll('[data-action]').forEach(b=>{const a=b.dataset.action;const end=e=>{if(e)e.preventDefault();if(a==='left'||a==='right')hold[a]=false};b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch{}if(a==='left'||a==='right')hold[a]=true;else action(a)});b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);b.addEventListener('lostpointercapture',end);b.addEventListener('click',e=>{if(e.detail===0&&a!=='left'&&a!=='right')action(a)})});el('start').addEventListener('click',start);el('reset').addEventListener('click',reset);el('ultimate').addEventListener('click',ultimate);el('ultimate').addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){e.preventDefault();ultimate()}});document.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',' ':'punch',z:'web',x:'ultimate'};const a=map[e.key];if(!a)return;e.preventDefault();if(a==='left'||a==='right')hold[a]=true;else if(!e.repeat){if(a==='ultimate')ultimate();else action(a)}});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')hold.left=false;if(e.key==='ArrowRight')hold.right=false});window.addEventListener('blur',()=>hold.left=hold.right=false);reset()})();
</script></body></html>
